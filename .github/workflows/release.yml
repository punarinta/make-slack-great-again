# The release pipeline: build and test every platform, then publish.
#
# Runs only on the public repo (punarinta/make-slack-great-again), where the
# standard runners are free; the private dev repo carries this file only to
# sync it (scripts/sync-to-public.sh) and never runs it.
#
#   PR into `release`      build + test everything, publish nothing
#   push to `release`      (= merging that PR) build + test, then publish:
#                          GitHub Release (binaries + manifests), Homebrew cask,
#                          msga's own Flatpak repository (msga.app/flatpak)
#   Run workflow (manual)  mode "build": the PR checks on any branch;
#                          mode "draft": also a DRAFT release (invisible to the
#                          public, no tag until published), the cask on the
#                          tap's `ci-test` branch, no Flatpak repository — the
#                          safe end-to-end test;
#                          mode "flatpak": the Flatpak repository again, built
#                          from the latest release tag (no new release)
#
# msga.app/download/* redirects to the newest release here (website/msga.app.conf),
# so a release needs no site deploy. See docs/releasing.md.
#
# Secrets (Settings → Secrets and variables → Actions), both optional — the
# step is skipped without its secret:
#   HOMEBREW_TAP_TOKEN    fine-grained PAT, punarinta/homebrew-msga, Contents: write
#   FLATPAK_SIGNING_KEY   the armored secret GPG key that signs the Flatpak repo
# The Flatpak repository is a GitHub Pages site of this repo (deployed by the
# flatpak-site job; msga.app/flatpak/ proxies to it). Flathub isn't fed from
# here: its policy wants a manifest written by hand, and its own update
# checker then follows the release tags.

name: Release

on:
  pull_request:
    branches: [release]
  push:
    branches: [release]
  workflow_dispatch:
    inputs:
      mode:
        description: "build = build and test only; draft = also a draft release + cask on the tap's ci-test branch; flatpak = publish the Flatpak repository from the latest release tag"
        type: choice
        options: [build, draft, flatpak]
        default: build

permissions:
  contents: read

concurrency:
  group: release-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Commits the pipeline makes elsewhere (the Homebrew tap, the Flathub repo).
  GIT_AUTHOR_NAME: Vladimir Osipov
  GIT_AUTHOR_EMAIL: vladimir.g.osipov@gmail.com
  GIT_COMMITTER_NAME: Vladimir Osipov
  GIT_COMMITTER_EMAIL: vladimir.g.osipov@gmail.com

jobs:
  # ── What this run is: version, tag, whether it publishes ───────────────────
  prepare:
    if: github.repository == 'punarinta/make-slack-great-again'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read # the PR runs and their artifacts (reuse below)
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
      draft: ${{ steps.plan.outputs.draft }}
      reuse: ${{ steps.reuse.outputs.run }}
      only_flatpak: ${{ steps.plan.outputs.only_flatpak }}
      ref: ${{ steps.plan.outputs.ref }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the previous release tags
      - id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          source_version="$(grep -m1 'MSGA_VERSION' version.cmake | grep -oE '[0-9]+' | head -1)"
          [[ -n "$source_version" ]] || { echo "::error::no MSGA_VERSION in version.cmake"; exit 1; }

          # Release tags are dates (2026-11-18; a second release that day
          # 2026-11-18-2).
          prev_tag="$(git tag --list '20[0-9][0-9]-*' --sort=-creatordate | head -1)"
          # The version that release shipped: its manifest says (the builds
          # get theirs from here, not from the tag's version.cmake); releases
          # from before this workflow have none, their version.cmake does.
          prev_version=0
          if [[ -n "$prev_tag" ]]; then
              prev_version="$(gh release download "$prev_tag" -R "$GITHUB_REPOSITORY" \
                  -p msga-linux-x86_64.manifest -O - 2>/dev/null | jq -r '.version // empty' || true)"
              [[ "$prev_version" =~ ^[0-9]+$ ]] || prev_version="$(git show "${prev_tag}:version.cmake" 2>/dev/null |
                  grep -m1 'MSGA_VERSION' | grep -oE '[0-9]+' | head -1 || true)"
              [[ "$prev_version" =~ ^[0-9]+$ ]] || prev_version=0
          fi

          only_flatpak=false; ref=""
          case "$EVENT" in
              push) publish=true; draft=false ;;
              workflow_dispatch)
                  case "$MODE" in
                      draft) publish=true; draft=true ;;
                      flatpak) # the latest release, as it was tagged
                          publish=false; draft=false; only_flatpak=true; ref="$prev_tag"
                          [[ -n "$ref" ]] || { echo "::error::no release tag to build the Flatpak from"; exit 1; } ;;
                      *) publish=false; draft=false ;;
                  esac ;;
              *) publish=false; draft=false ;;
          esac

          # The version is never typed: the last release's + 1 (the in-app
          # updater only offers a higher one), written into version.cmake by
          # every build job, and back onto master once released. The flatpak
          # mode rebuilds the last release itself. Without any release yet,
          # version.cmake's.
          if [[ "$only_flatpak" == true ]]; then
              version="$prev_version"
          elif (( prev_version > 0 )); then
              version=$((prev_version + 1))
          else
              version="$source_version"
          fi
          # master normally says the last release (written back after it);
          # anything else is worth a note, never a failure.
          if [[ "$source_version" != "$version" && "$source_version" != "$prev_version" ]]; then
              echo "::notice::version.cmake says ${source_version}; this build is ${version} (last release ${prev_tag:-none}: ${prev_version})"
          fi

          day="$(date -u +%F)"
          tag="$day"; n=2
          while git rev-parse -q --verify "refs/tags/${tag}" >/dev/null ||
                gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; do
              tag="${day}-${n}"; n=$((n + 1))
          done

          {
              echo "version=${version}"
              echo "tag=${tag}"
              echo "publish=${publish}"
              echo "draft=${draft}"
              echo "only_flatpak=${only_flatpak}"
              echo "ref=${ref}"
          } >>"$GITHUB_OUTPUT"
          {
              echo "### msga ${version} → ${tag}"
              echo "Previous release: ${prev_tag:-none} (version ${prev_version})"
              echo "Publishes: ${publish}$([[ $draft == true ]] && echo ' (draft)')"
          } >>"$GITHUB_STEP_SUMMARY"

      # A PR run notes the source tree it built and tested (GitHub's preview
      # merge into `release`), so that the merge can publish its binaries.
      - name: Record the tested tree
        if: github.event_name == 'pull_request'
        run: git rev-parse 'HEAD^{tree}' >tested-tree.txt
      - if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: tested-tree
          path: tested-tree.txt
          retention-days: 7 # as long as the release-* artifacts

      # Publishing: a successful PR run that tested exactly this tree (nothing
      # landed on master between its checks and the merge) already built and
      # tested every platform — its release-* artifacts are published and the
      # builds below are skipped. Otherwise they run as usual.
      - id: reuse
        name: Find a PR run that tested this tree
        if: steps.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tree="$(git rev-parse 'HEAD^{tree}')"
          want="release-freebsd release-linux release-macos release-openbsd release-windows"
          runs="$(gh run list -R "$GITHUB_REPOSITORY" --workflow release.yml --event pull_request \
              --status success -L 20 --json databaseId --jq '.[].databaseId')"
          for id in $runs; do
              d="$(mktemp -d)"
              gh run download "$id" -R "$GITHUB_REPOSITORY" -n tested-tree -D "$d" >/dev/null 2>&1 || continue
              [[ "$(cat "$d/tested-tree.txt" 2>/dev/null)" == "$tree" ]] || continue
              have="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" \
                  --jq '[.artifacts[] | select(.expired | not) | .name | select(startswith("release-"))] | unique | join(" ")')"
              flatpak="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/artifacts?per_page=100" \
                  --jq '[.artifacts[] | select(.expired | not) | select(.name == "flatpak-repo")] | length')"
              if [[ "$have" == "$want" && "$flatpak" -gt 0 ]]; then
                  echo "run=${id}" >>"$GITHUB_OUTPUT"
                  echo "Reusing the binaries of PR run ${id} (same tree ${tree:0:12}); its symbols-* artifacts are there too." >>"$GITHUB_STEP_SUMMARY"
                  exit 0
              fi
          done
          echo "No PR run tested this exact tree (${tree:0:12}): building it here." >>"$GITHUB_STEP_SUMMARY"

  # ── Linux: static musl binary, tests on musl, X11 smoke launch ─────────────
  linux:
    needs: prepare
    if: needs.prepare.outputs.reuse == '' && needs.prepare.outputs.only_flatpak != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      # Fonts for the text/UI tests (mounted into the build container) and
      # Xvfb for the smoke launch.
      - name: Install fonts and Xvfb
        timeout-minutes: 45 # a slow Ubuntu mirror once took 32 min for Wine
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends xvfb xauth \
              fonts-dejavu-core fonts-liberation2 fonts-noto-core fonts-noto-color-emoji fonts-noto-cjk
      - name: Set the release version
        run: perl -pi -e 's/set\(MSGA_VERSION \d+\)/set(MSGA_VERSION ${{ needs.prepare.outputs.version }})/' version.cmake
      - name: Build, test, smoke launch
        run: scripts/release-linux-static.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-linux
          path: |
            dist/msga-linux-x86_64
            dist/msga-linux-x86_64.manifest
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-linux-${{ needs.prepare.outputs.tag }}
          path: dist/msga-linux-x86_64.debug
          retention-days: 90

  # ── Windows: mingw cross-build in Docker, Wine smoke launch ────────────────
  windows:
    needs: prepare
    if: needs.prepare.outputs.reuse == '' && needs.prepare.outputs.only_flatpak != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - name: Install Wine and Xvfb
        timeout-minutes: 45 # a slow Ubuntu mirror once took 32 min for Wine
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends wine wine64 xvfb xauth fonts-dejavu-core
      - name: Set the release version
        run: perl -pi -e 's/set\(MSGA_VERSION \d+\)/set(MSGA_VERSION ${{ needs.prepare.outputs.version }})/' version.cmake
      - name: Build, smoke launch under Wine
        run: scripts/release-windows.sh
      - uses: actions/upload-artifact@v7
        with:
          name: release-windows
          path: |
            dist/msga-windows-x86_64.exe
            dist/msga-windows-x86_64.manifest
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-windows-${{ needs.prepare.outputs.tag }}
          path: dist/msga-windows-x86_64.debug
          retention-days: 90

  # ── FreeBSD / OpenBSD: cross-built against a downloaded sysroot ────────────
  # In Ubuntu 26.04 for the same clang/lld as the dev machines (24.04's
  # clang 18 is older than what the code is built with).
  bsd:
    needs: prepare
    if: needs.prepare.outputs.reuse == '' && needs.prepare.outputs.only_flatpak != 'true'
    runs-on: ubuntu-24.04
    container: ubuntu:26.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [freebsd, openbsd]
    steps:
      - name: Install the cross toolchain
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update -q
          apt-get install -y -q --no-install-recommends ca-certificates git clang lld llvm \
              cmake ninja-build pkgconf libwayland-bin python3 binutils xz-utils zstd
      - uses: actions/checkout@v7
      - name: Set the release version
        run: perl -pi -e 's/set\(MSGA_VERSION \d+\)/set(MSGA_VERSION ${{ needs.prepare.outputs.version }})/' version.cmake
      - name: Cache the sysroot
        uses: actions/cache@v6
        with:
          path: build-bsd-sysroot/${{ matrix.os }}
          key: bsd-sysroot-${{ matrix.os }}-${{ hashFiles('scripts/bsd-sysroot.py') }}
      - name: Build
        run: scripts/release-bsd.sh ${{ matrix.os }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.os }}
          path: |
            dist/msga-${{ matrix.os }}-x86_64.tar.gz
            dist/msga-${{ matrix.os }}-x86_64.manifest
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: symbols-${{ matrix.os }}-${{ needs.prepare.outputs.tag }}
          path: dist/msga-${{ matrix.os }}-x86_64.debug
          retention-days: 90

  # ── macOS arm64: tests, app bundle, DMG ────────────────────────────────────
  # The shipped DMG is built on macOS 26; macOS 15 runs the same build and
  # tests as a check, for users on older systems (msga runs on 14 and later).
  macos:
    needs: prepare
    if: needs.prepare.outputs.reuse == '' && needs.prepare.outputs.only_flatpak != 'true'
    runs-on: macos-${{ matrix.os }}
    name: macos (${{ matrix.os }})
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: ["26", "15"]
    steps:
      - uses: actions/checkout@v7
      - name: Install CMake and Ninja
        run: |
          command -v cmake >/dev/null || brew install cmake
          command -v ninja >/dev/null || brew install ninja
      - name: Set the release version
        run: perl -pi -e 's/set\(MSGA_VERSION \d+\)/set(MSGA_VERSION ${{ needs.prepare.outputs.version }})/' version.cmake
      - name: Build, test, DMG
        run: scripts/release-mac.sh
      - if: matrix.os == '26'
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            dist/msga-macos-arm64.dmg
            dist/msga-macos-arm64.manifest
          if-no-files-found: error
          retention-days: 7
      - if: matrix.os == '26'
        uses: actions/upload-artifact@v7
        with:
          name: symbols-macos-${{ needs.prepare.outputs.tag }}
          path: dist/msga-macos-arm64.dSYM
          retention-days: 90

  # ── Flatpak: builds (from this checkout) and lints; the repo is kept ──────
  flatpak:
    needs: prepare
    if: needs.prepare.outputs.reuse == ''
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.ref }} # the release tag in the flatpak mode
      # Only flatpak itself: build-local.sh then builds with Flathub's own
      # org.flatpak.Builder app (current flatpak-builder, appstream, eu-strip,
      # the linter), as Flathub does. Ubuntu 24.04's flatpak-builder and
      # appstreamcli are too old for the metainfo.
      - name: Install flatpak
        timeout-minutes: 45 # a slow Ubuntu mirror once took 32 min for Wine
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends flatpak dbus-daemon
          # Ubuntu 24.04 blocks the unprivileged user namespaces bubblewrap needs.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # A runner has no login session: no session bus (the Builder app asks
      # the host's flatpak to install runtimes over it: a private one for the
      # build) and no XDG_RUNTIME_DIR (where flatpak keeps its instances).
      - name: Set the release version
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          perl -pi -e "s/set\(MSGA_VERSION \d+\)/set(MSGA_VERSION ${VERSION})/" version.cmake
          m=packaging/flatpak/com.nisdos.msga.metainfo.xml
          grep -q "<release version=\"${VERSION}\"" "$m" ||
              perl -0pi -e "s|<releases>\n|<releases>\n    <release version=\"${VERSION}\" date=\"$(date -u +%F)\"/>\n|" "$m"
          grep -m2 'release version' "$m"
      - name: Build and lint
        run: |
          export XDG_RUNTIME_DIR="${XDG_RUNTIME_DIR:-/run/user/$(id -u)}"
          sudo mkdir -p "$XDG_RUNTIME_DIR"
          sudo chown "$(id -u):$(id -g)" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          dbus-run-session -- packaging/flatpak/build-local.sh --lint
      # flatpak-builder's repo, for the flatpak-site job (one file: an
      # artifact keeps no file modes).
      - name: Keep the repo
        run: tar -C build-flatpak -cf flatpak-repo.tar repo
      - uses: actions/upload-artifact@v7
        with:
          name: flatpak-repo
          path: flatpak-repo.tar
          if-no-files-found: error
          retention-days: 7

  # ── Publish: only after every build and test passed ────────────────────────
  publish:
    needs: [prepare, linux, windows, bsd, macos, flatpak]
    # Built here (every build succeeded) or reused from a PR run (all skipped).
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      needs.prepare.outputs.publish == 'true' &&
      (needs.prepare.outputs.reuse != '' || !contains(needs.*.result, 'failure'))
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      actions: read # a PR run's artifacts
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
      TAG: ${{ needs.prepare.outputs.tag }}
      DRAFT: ${{ needs.prepare.outputs.draft }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - if: needs.prepare.outputs.reuse == ''
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - if: needs.prepare.outputs.reuse != ''
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          run-id: ${{ needs.prepare.outputs.reuse }}
          github-token: ${{ github.token }}

      # Each manifest must describe the binary next to it: this version and
      # its actual hash (the in-app updater and the cask both trust it).
      - name: Check the artifacts
        run: |
          set -euo pipefail
          assets=(msga-linux-x86_64 msga-windows-x86_64.exe msga-macos-arm64.dmg
                  msga-freebsd-x86_64.tar.gz msga-openbsd-x86_64.tar.gz)
          for a in "${assets[@]}"; do
              stem="${a%.tar.gz}"; [[ "$stem" != "$a" ]] || stem="${a%.*}"
              m="dist/${stem}.manifest"
              [[ -f "dist/$a" && -f "$m" ]] || { echo "::error::missing dist/$a or $m"; exit 1; }
              v="$(jq -r .version "$m")"; s="$(jq -r .sha256 "$m")"
              [[ "$v" == "$VERSION" ]] || { echo "::error::$m is version $v, not $VERSION"; exit 1; }
              [[ "$s" == "$(sha256sum "dist/$a" | cut -d' ' -f1)" ]] ||
                  { echo "::error::dist/$a does not match the sha256 in $m"; exit 1; }
          done
          ls -l dist

      # Notes: the description of the merged PR (master → release), so they
      # are written where the release is reviewed; edit them on GitHub later
      # if needed.
      - name: GitHub Release
        run: |
          set -euo pipefail
          body=""
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
              body="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
                  --jq '[.[] | select(.base.ref == "release")][0].body // ""' 2>/dev/null || true)"
          fi
          [[ -n "$body" ]] || body="msga ${VERSION}"
          printf '%s\n' "$body" >notes.md
          flags=(--title "$TAG" --notes-file notes.md --target "$GITHUB_SHA")
          if [[ "$DRAFT" == true ]]; then flags+=(--draft); else flags+=(--latest); fi
          gh release create "$TAG" "${flags[@]}" dist/*
          echo "Release: $(gh release view "$TAG" --json url --jq .url)" >>"$GITHUB_STEP_SUMMARY"

      # The cask is rendered from packaging/homebrew/msga.rb.in. A draft run
      # pushes it to the tap's ci-test branch, which brew never reads.
      - name: Homebrew cask
        env:
          TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "$TOKEN" ]]; then
              echo "::warning::no HOMEBREW_TAP_TOKEN secret: cask not updated"; exit 0
          fi
          branch=master; [[ "$DRAFT" == true ]] && branch=ci-test
          git clone -q "https://x-access-token:${TOKEN}@github.com/punarinta/homebrew-msga.git" tap
          git -C tap checkout -q -B "$branch"
          sha="$(jq -r .sha256 dist/msga-macos-arm64.manifest)"
          sed -e "s/@VERSION@/${VERSION}/g" -e "s/@TAG@/${TAG}/g" -e "s/@SHA256@/${sha}/g" \
              packaging/homebrew/msga.rb.in >tap/Casks/msga.rb
          if git -C tap diff --quiet; then echo "Cask already current."; exit 0; fi
          git -C tap commit -q -am "msga ${VERSION}"
          git -C tap push -q --force-with-lease origin "$branch"
          echo "Cask: msga ${VERSION} on homebrew-msga/${branch}" >>"$GITHUB_STEP_SUMMARY"

      # The source on master says the version just released: builds from it
      # (and the next release's checks) agree with what users have.
      - name: Version on master
        if: needs.prepare.outputs.draft != 'true'
        run: |
          set -euo pipefail
          git fetch -q origin master
          git checkout -q -B master origin/master
          perl -pi -e "s/set\(MSGA_VERSION \d+\)/set(MSGA_VERSION ${VERSION})/" version.cmake
          if git diff --quiet; then echo "master already says ${VERSION}."; exit 0; fi
          git commit -q -m "version ${VERSION}" -- version.cmake
          git push -q origin master
          echo "master: version ${VERSION}" >>"$GITHUB_STEP_SUMMARY"

  # ── msga's own Flatpak repository: signed, on GitHub Pages ─────────────────
  # After a published release (or in the flatpak mode): the Flatpak job's repo
  # (or the reused PR run's), the app on the `stable` branch, signed with
  # FLATPAK_SIGNING_KEY; packaging/flatpak/publish-repo.sh makes the site and
  # the .flatpakrepo/.flatpakref users start from. Served at msga.app/flatpak/
  # (website/msga.app.conf proxies it).
  flatpak-site:
    needs: [prepare, flatpak, publish]
    if: >-
      !cancelled() && needs.prepare.result == 'success' &&
      ((needs.prepare.outputs.only_flatpak == 'true' && needs.flatpak.result == 'success') ||
       (needs.prepare.outputs.publish == 'true' && needs.prepare.outputs.draft != 'true' &&
        needs.publish.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read # a reused PR run's artifact
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      SIGNING_KEY: ${{ secrets.FLATPAK_SIGNING_KEY }}
    steps:
      - name: Check the signing key
        id: key
        run: |
          if [[ -z "$SIGNING_KEY" ]]; then
              echo "::warning::no FLATPAK_SIGNING_KEY secret: the Flatpak repository isn't published"
              echo "ok=false" >>"$GITHUB_OUTPUT"
          else
              echo "ok=true" >>"$GITHUB_OUTPUT"
          fi
      # This workflow's own commit: publish-repo.sh (a release tag built in the
      # flatpak mode may predate it).
      - if: steps.key.outputs.ok == 'true'
        uses: actions/checkout@v7
      - if: steps.key.outputs.ok == 'true' && needs.prepare.outputs.reuse == ''
        uses: actions/download-artifact@v8
        with:
          name: flatpak-repo
      - if: steps.key.outputs.ok == 'true' && needs.prepare.outputs.reuse != ''
        uses: actions/download-artifact@v8
        with:
          name: flatpak-repo
          run-id: ${{ needs.prepare.outputs.reuse }}
          github-token: ${{ github.token }}
      - name: Install flatpak and ostree
        if: steps.key.outputs.ok == 'true'
        timeout-minutes: 45
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q --no-install-recommends flatpak ostree
      - name: Sign and make the site
        if: steps.key.outputs.ok == 'true'
        run: |
          set -euo pipefail
          export GPG_HOMEDIR="$RUNNER_TEMP/gnupg"
          mkdir -m 700 "$GPG_HOMEDIR"
          printf '%s\n' "$SIGNING_KEY" | gpg --homedir "$GPG_HOMEDIR" --batch --import
          export GPG_KEY_ID="$(gpg --homedir "$GPG_HOMEDIR" --list-secret-keys --with-colons |
              awk -F: '/^fpr/ { print $10; exit }')"
          mkdir src-repo && tar -C src-repo -xf flatpak-repo.tar
          packaging/flatpak/publish-repo.sh src-repo/repo site https://msga.app/flatpak
      - if: steps.key.outputs.ok == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        if: steps.key.outputs.ok == 'true'
        uses: actions/deploy-pages@v5
